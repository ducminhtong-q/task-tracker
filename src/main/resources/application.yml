spring:
  application:
    name: task-service
  mongodb:
    uri: mongodb://localhost:27017/task_tracker_db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      notificationService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 5
        minimum-number-of-calls: 5